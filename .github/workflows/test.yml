name: Tests

# Runs the whole suite on every push and PR. The publish workflow only runs on
# version tags, which is too late to find out anything is wrong.
#
# stub_consistency_test.py matters because condeltri.pyi is hand-written and is
# what every downstream type checker reads instead of the extension, so it has
# to track cdt_bindings.cpp.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # floor from requires-python, plus a current release
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build and install condeltri
        # built from the checkout, so the extension under test comes from the
        # same cdt_bindings.cpp as the condeltri.pyi being checked against it
        run: python -m pip install --verbose .
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt
      - name: Run the test suite
        # run from a scratch directory so `import condeltri` resolves to the
        # installed extension and never to something in the source tree.
        # cdt_bindings_test.py locates its fixtures relative to __file__, so it
        # does not care about the working directory.
        run: |
          mkdir -p /tmp/run && cd /tmp/run
          python -m pytest -v \
            "$GITHUB_WORKSPACE/stub_consistency_test.py" \
            "$GITHUB_WORKSPACE/cdt_bindings_test.py"
