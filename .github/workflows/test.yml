name: Stub consistency

# condeltri.pyi is hand-written and is what every downstream type checker reads
# instead of the extension, so it has to track cdt_bindings.cpp. The publish
# workflow only runs on version tags, which is too late to find out; this runs
# on every push and PR.
#
# Only stub_consistency_test.py is run here. cdt_bindings_test.py cannot pass
# from a plain checkout: test_insert_vertices/test_insert_conform_edges read
# CDT/visualizer/data/*.txt by relative path, but the upstream CDT sources are
# pulled in by FetchContent at build time and are not part of this repository
# (there is no .gitmodules, so the `submodules: true` in the publish workflow is
# a no-op). Add it here once those tests can locate their fixtures.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  stub-consistency:
    name: Stub matches extension (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # floor from requires-python, plus a current release
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build and install condeltri
        # built from the checkout, so the extension under test comes from the
        # same cdt_bindings.cpp as the condeltri.pyi being checked against it
        run: python -m pip install --verbose .
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt
      - name: Check stub against the built extension
        # run from a scratch directory so `import condeltri` resolves to the
        # installed extension and never to something in the source tree
        run: |
          mkdir -p /tmp/run && cd /tmp/run
          python -m pytest -v "$GITHUB_WORKSPACE/stub_consistency_test.py"
