name: Build wheels+sdist and publish to PyPI

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

jobs:
  make_sdist:
    name: Make SDist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Build SDist
        run: pipx run build --sdist
      - uses: actions/upload-artifact@v7
        with:
          name: cibw-sdist
          path: dist/*.tar.gz
  build_wheels:
    name: Wheels on ${{ matrix.os }} ${{ matrix.manylinux || matrix.musllinux || '' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux builds: one job per manylinux baseline
          - os: ubuntu-latest
            manylinux: manylinux2014
            manylinux_x86_64_image: manylinux2014
            cibw_build: "*manylinux*"
          - os: ubuntu-latest
            manylinux: manylinux_2_28
            manylinux_x86_64_image: manylinux_2_28
            cibw_build: "*manylinux*"
          - os: ubuntu-latest
            manylinux: manylinux_2_34
            manylinux_x86_64_image: manylinux_2_34
            cibw_build: "*manylinux*"
          # Musllinux builds
          - os: ubuntu-latest
            musllinux: musllinux_1_2
            cibw_build: "*musllinux*"
          # Windows & macOS builds
          - os: windows-latest
          - os: macos-15-intel  # Intel / x86_64
          - os: macos-15        # Apple Silicon / arm64
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pypa/cibuildwheel@v4.2
        env:
          CIBW_BUILD: ${{ matrix.cibw_build || '*' }}
          CIBW_ARCHS: auto64
          CIBW_MANYLINUX_X86_64_IMAGE: ${{ matrix.manylinux_x86_64_image || '' }}
          CIBW_MUSLLINUX_X86_64_IMAGE: ${{ matrix.musllinux || '' }}
          # manylinux2014 is glibc 2.17, a baseline NumPy stopped publishing
          # wheels for after 2.2.x, so pip falls back to the NumPy sdist there
          # and that build needs a newer GCC than the image's 10.2. condeltri
          # itself requires an unpinned `numpy`, and cibuildwheel installs the
          # wheel *before* CIBW_TEST_REQUIRES, so the pin only takes effect if
          # a satisfying NumPy is already in the test environment by then --
          # hence before-test rather than test-requires.
          CIBW_BEFORE_TEST: ${{ matrix.manylinux == 'manylinux2014' && 'pip install "numpy<2.3"' || '' }}
          # Exercise each wheel on the platform it was built for. This is the
          # only place a platform-specific float-formatting difference can
          # show up: the Sweden case in cdt_bindings_test.py compares a digest
          # of the serialised triangulation, and the Windows and macOS wheels
          # are not covered by test.yml. NumPy comes in as a dependency of the
          # wheel being tested.
          CIBW_TEST_REQUIRES: pytest
          # NumPy 2.2.x does not publish CPython 3.14 wheels, and newer NumPy
          # releases no longer provide manylinux2014 wheels. The condeltri
          # cp314 manylinux2014 wheel can still be built, but this test
          # dependency cannot be installed from wheels on that baseline.
          CIBW_TEST_SKIP: ${{ matrix.manylinux == 'manylinux2014' && 'cp314-*' || '' }}
          # cibuildwheel runs this from a temporary directory, so `import
          # condeltri` resolves to the installed wheel rather than the source
          # tree; both test files find their own data relative to __file__.
          CIBW_TEST_COMMAND: >-
            pytest -v
            "{project}/stub_consistency_test.py"
            "{project}/cdt_bindings_test.py"
      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: cibw-wheels-${{ matrix.os }}${{ (matrix.manylinux || matrix.musllinux) && format('-{0}', matrix.manylinux || matrix.musllinux) || '' }}
          path: wheelhouse/*.whl
  publish_all:
    name: Publish on PyPI
    needs: [build_wheels, make_sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      attestations: write
      contents: read
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: cibw-*
          path: dist
          merge-multiple: true
      - name: Generate artifact attestations
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: "dist/*"
      - name: Upload to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
